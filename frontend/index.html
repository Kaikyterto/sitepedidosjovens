<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App jovens</title>

    <link rel="stylesheet" href="css/index.css" />
  </head>

  <body>
    <!-- =======================
         LOGIN
    ======================== -->
    <div id="principal">
      <div id="caixa_nome">
        <h1>Bem-vindo ao App Jovens</h1>

        <form id="form_pedido">
          <label for="nome_usuario">Nome:</label>

          <input
            type="text"
            id="nome_usuario"
            placeholder="Digite seu nome"
            required
          />

          <button id="btn_nome" type="button">Entrar</button>
        </form>
      </div>

      <!-- =======================
           CARDÁPIO (DINÂMICO)
      ======================== -->
      <div id="cardapio" style="display: none">
        <h2 style="color: #ffea00; text-align: center">Cardápio</h2>
      </div>

      <!-- =======================
           CARRINHO (SIDEBAR)
      ======================== -->
      <div id="div_conta">
        <h2 style="color: #ffea00; text-align: center">Seu pedido</h2>
      </div>
    </div>

    <!-- =======================
         PIX AREA
    ======================== -->
    <div id="principal_qr" style="display: none">
      <div id="div_qrcode">
        <h3>Pedido realizado com sucesso! ✅</h3>
        <canvas id="qrcode"></canvas>
      </div>

      <div id="div_pix-copia-cola">
        <h3>PIX Copia e Cola</h3>

        <textarea id="pix-copia-cola" readonly></textarea>

        <button id="btn-copiar">Copiar código PIX</button>
      </div>
    </div>

    <!-- =======================
         SCRIPTS
    ======================== -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
