<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ranking - Jogo de Perguntas</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 20px; background: #111318; color: #f3f4f6; }
    .container { max-width: 780px; margin: 0 auto; display: grid; gap: 18px; }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: flex-end;
      justify-content: space-between;
      background: #1b1f27;
      padding: 16px 18px;
      border-radius: 10px;
      border: 1px solid #2d3340;
    }
    .topbar h1 { margin: 0 0 4px 0; font-size: 22px; }
    .small { font-size: 13px; color: #9ca3af; }
    .select-box { min-width: 240px; flex: 1; max-width: 340px; }
    label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 6px; }
    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #3a4254;
      background: #111318;
      color: #f3f4f6;
      font-size: 15px;
    }
    .card {
      background: #1b1f27;
      padding: 18px;
      border-radius: 10px;
      border: 1px solid #2d3340;
    }
    .card-header {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .card-header h2 { margin: 0; font-size: 18px; }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      background: #2563eb;
      color: #fff;
    }
    button:hover { background: #1d4ed8; }
    .badge { padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: bold; }
    .ativo { background: #14532d; color: #86efac; }
    .inativo { background: #450a0a; color: #fca5a5; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 15px; }
    th, td { text-align: left; padding: 11px 10px; border-bottom: 1px solid #2d3340; }
    th { color: #9ca3af; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; }
    .pos-1 td:first-child { color: #facc15; font-weight: bold; }
    .pos-2 td:first-child { color: #e2e8f0; font-weight: bold; }
    .pos-3 td:first-child { color: #fb923c; font-weight: bold; }
    .pts { font-weight: bold; font-size: 16px; color: #4ade80; }
    .erro { color: #fca5a5; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <h1>Ranking do Campeonato</h1>
        <div class="small">Acompanhe a pontuação dos jogadores em tempo real</div>
      </div>

      <div class="select-box">
        <label for="select-campeonato">Escolha o campeonato</label>
        <select id="select-campeonato"></select>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div>
          <h2 id="titulo-campeonato">Carregando...</h2>
          <div id="status-texto" class="small"></div>
        </div>
        <div class="actions">
          <span id="status-badge" class="badge" style="display: none;"></span>
          <button type="button" id="btn-atualizar">Atualizar</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Jogador</th>
            <th>Acertos</th>
            <th>Pontos</th>
          </tr>
        </thead>
        <tbody id="tabela-ranking">
          <tr><td colspan="4" class="small">Carregando ranking...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="js/ranking.js"></script>
</body>
</html>
